name: Java CI

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master

jobs:

  test:
    name: Run TEsts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn clean test

  build:
    name: Build application
    runs-on: ubuntu-latest

    needs: test
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn package -DskipTests